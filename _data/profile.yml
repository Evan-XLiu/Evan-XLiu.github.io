short_bio_text_justify: false
short_bio: >-
  <p>
    I am currently pursuing an MSc in Robotics at the
    <a href="https://nus.edu.sg/" target="_blank" rel="noopener noreferrer">National University of Singapore (NUS)</a>,
    where I am a member of the <a href="https://magiclab-nus.github.io/" target="_blank" rel="noopener noreferrer">MAGIC Lab</a>,
    advised by Prof. <a href="https://jiafei1224.github.io/" target="_blank" rel="noopener noreferrer">Jiafei Duan</a>.
    Previously, I was a research intern at the <a href="https://linsats.github.io/" target="_blank" rel="noopener noreferrer">LinS Lab</a>
    under the guidance of Prof. <a href="https://linsats.github.io/" target="_blank" rel="noopener noreferrer">Lin Shao</a>,
    and also collaborated with Prof. <a href="https://scholar.google.com/citations?user=1t1iV1AAAAAJ&amp;hl=zh-CN&amp;oi=ao" target="_blank" rel="noopener noreferrer">Yongquan Chen</a>
    at the <a href="https://airs.cuhk.edu.cn/en" target="_blank" rel="noopener noreferrer">AIRS</a>.
    I received my Bachelor's degree in Automation from the
    <a href="http://en.hitsz.edu.cn/" target="_blank" rel="noopener noreferrer">Harbin Institute of Technology, Shenzhen (HITSZ)</a>.
  </p>
  <p>
    My research centers on robot manipulation, with a particular interest in dexterous manipulation and learning-based control.
    I am also interested in vision-language-action (VLA) models and their potential for generalizable robotic manipulation.
  </p>
  <p>
    If you share similar interests, feel free to reach out. I am always happy to exchange ideas and explore potential collaborations.
  </p>

short_bio_zh: >-
  <p>
    目前，我在
    <a href="https://nus.edu.sg/" target="_blank" rel="noopener noreferrer">新加坡国立大学(NUS)</a>
    攻读机器人学理学硕士，并在
    <a href="https://magiclab-nus.github.io/" target="_blank" rel="noopener noreferrer">MAGIC Lab</a>
    从事机器人学习与操作相关研究，导师为 <a href="https://jiafei1224.github.io/" target="_blank" rel="noopener noreferrer">Jiafei Duan教授</a>。此前，我在
    <a href="https://linsats.github.io/" target="_blank" rel="noopener noreferrer">Lin Shao教授</a> 的
    <a href="https://linsats.github.io/" target="_blank" rel="noopener noreferrer">LinS Lab</a> 担任科研实习生，也曾在
    <a href="https://airs.cuhk.edu.cn/en" target="_blank" rel="noopener noreferrer">深圳市人工智能与机器人研究院(AIRS)</a>
    与 <a href="https://scholar.google.com/citations?user=1t1iV1AAAAAJ&amp;hl=zh-CN&amp;oi=ao" target="_blank" rel="noopener noreferrer">Yongquan Chen教授</a> 合作。我本科毕业于
    <a href="http://en.hitsz.edu.cn/" target="_blank" rel="noopener noreferrer">哈尔滨工业大学(深圳)</a> 自动化专业。
  </p>
  <p>
    我的研究聚焦于机器人操作，尤其是灵巧操作与基于学习的控制。我也关注视觉—语言—动作(VLA)模型及其在通用机器人操作中的应用。
  </p>
  <p>
    如果你也对这些方向感兴趣，欢迎与我交流，也期待有机会一起做些有意思的研究。
  </p>

