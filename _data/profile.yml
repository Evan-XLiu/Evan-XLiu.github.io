short_bio_text_justify: false
short_bio: >-
  <p>
    Hi! I am Xuanwei Liu (刘轩伟). I am currently a Master's student in Robotics at the
    <a href="https://nus.edu.sg/" target="_blank" rel="noopener noreferrer">National University of Singapore (NUS)</a>
    and work as a research intern advised by Prof.
    <a href="https://linsats.github.io/" target="_blank" rel="noopener noreferrer">Lin Shao</a>
    at the NUS LinS Lab. Previously, I was a research intern in dexterous manipulation at
    <a href="https://airs.cuhk.edu.cn/en" target="_blank" rel="noopener noreferrer">AIRS</a>,
    advised by Prof.
    <a href="https://scholar.google.com/citations?user=1t1iV1AAAAAJ&amp;hl=zh-CN&amp;oi=ao" target="_blank" rel="noopener noreferrer">Yongquan Chen</a>.
    I received my Bachelor's degree in Automation from the
    <a href="http://en.hitsz.edu.cn/" target="_blank" rel="noopener noreferrer">Harbin Institute of Technology, Shenzhen (HITSZ)</a>.
  </p>
  <p>
    My research focuses on robot manipulation, especially dexterous manipulation and learning-based 
    control. I am interested in developing robotic systems that can perceive, reason, and interact 
    with complex environments.
  </p>
  <p>
    Feel free to contact me if you are interested in discussing or collaborating with me.
  </p>

